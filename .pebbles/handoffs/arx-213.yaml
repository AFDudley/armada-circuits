summary: >
  Completed the owned Transact shape matrix: added 29 new
  src/main/main_NxM_owned.circom entry files (N 1-8, M 1-4, 32 shapes
  total), each instantiating TransactOwned(N, M), and registered every
  new shape in scripts/compile.sh's SHAPES array. The three pre-existing
  owned shapes (1x1_owned, 1x2_owned, 1x3_owned) are untouched -- their
  circuit files and the scripts/compile.sh comment above SHAPES was
  updated only to stop claiming owned shapes are N=1-only, which was
  already stale. compile.sh now also measures each owned shape's real
  constraint count from circom2's own compiler output and writes
  build/owned_shapes_over_limit.json for any owned shape whose total
  exceeds the pinned ptau's 2^17 (131072) ceremony ceiling (scripts/
  ceremony/lib.sh PTAU_POWER=17); none of the 32 shapes exceed it, the
  largest (8x4_owned) measuring 85408 constraints. Authored two acceptance
  probes since the linked spec named them but they did not exist:
  scripts/verify_existing_owned_unchanged.py (git-diffs the baseline
  commit's three original owned files and any tracked verifying-key
  artifact naming them) and scripts/verify_owned_shapes_built.py (drives
  the real scripts/compile.sh with the real circom2 compiler to build all
  32 shapes, and in --limit-report mode independently re-measures every
  owned shape's constraint count via the real `snarkjs r1cs info` --
  never trusting compile.sh's own self-report -- and flags any shape that
  is actually over the limit but missing or wrong in
  owned_shapes_over_limit.json). I demonstrated both probes' discrimination
  by hand: lowering the hard limit to 50000 in both compile.sh and the
  oracle produced a correctly matching 16-shape report (0 violations);
  then deleting the 8x4_owned entry from that report while holding the
  oracle's threshold fixed made over_limit_without_constraint_count jump
  from 0 to 1, proving the check can actually fail. Ran all 5 linked
  acceptance tests for real at the final commit: the two grep checks (c1,
  c2) by hand, and the three behavior scripts (c3, c4, c5) via
  `python3 scripts/verify_existing_owned_unchanged.py --baseline
  614e3c8ee87cc81e0b6e2beb14f46fb303b4b2a6 && python3 scripts/
  verify_owned_shapes_built.py && python3 scripts/
  verify_owned_shapes_built.py --limit-report`, which exits 0 printing
  {"changed_files": 0, "changed_verifying_keys": 0},
  {"owned_build_dirs": 32, "missing_shapes": 0}, and
  {"over_limit_without_constraint_count": 0}. Also ran `npm run
  lint:circom` (circomspect) across the whole tree: one pre-existing,
  unrelated warning in src/lib/merkle.circom, nothing new from the 29
  added files. Installed pre-commit and the exophial wheel locally (the
  worktree had neither `pre-commit install`'d nor the exophial console
  scripts on PATH) and ran every pre-commit- and commit-msg-stage hook
  against the actual commit and its message for real; all pass.
