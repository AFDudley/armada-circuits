blocker: >
  The pinned Hermez power-17 ptau (scripts/ceremony/lib.sh's PTAU_URL,
  https://storage.googleapis.com/zkevm/ptau/powersOfTau28_hez_final_17.ptau,
  sha256 6b662a324867139fb1a20a324d90b6ff61856dfb23f59326909f14b0e2483ae0)
  is not reachable from this environment. `curl` to that URL returns HTTP
  403 with Google's own "Anonymous caller does not have
  storage.objects.get access" body. The documented S3 mirror
  (hermez.s3-eu-west-1.amazonaws.com) and several other known Hermez/PSE
  mirror URL patterns I tried also return HTTP 403 or 404. This is a
  genuine upstream denial, not a sandbox network block: curl resolved and
  connected directly to Google's own IP ranges (TLS handshake completed
  against the real storage.googleapis.com certificate), and the result
  was identical with the Bash tool's sandboxing disabled. No cached copy
  of this exact file exists anywhere on this host.

  scripts/ceremony/fetch-ptau.sh therefore exits nonzero before any
  owned-shape setup can run against the real file. Every
  check_owned.py mode except no-secrets-committed calls this step first
  and fails there (confirmed by running each mode; e.g. `python3
  scripts/ceremony/check_owned.py ptau-pin` raises
  subprocess.CalledProcessError from the curl exit status 22). This
  blocks acceptance clauses c1, c3, c4, c5, and c6 outright, and blocks
  c2 from being verified against the real file (its mechanics were only
  validated against a non-pinned stand-in, as described above). c7 does
  not depend on the ptau and passes.
next_action: >
  Someone with access to a currently-public, hash-verified copy of
  powersOfTau28_hez_final_17.ptau (sha256
  6b662a324867139fb1a20a324d90b6ff61856dfb23f59326909f14b0e2483ae0) should
  either restore public read access on the pinned bucket, or place a
  verified copy at build/ptau/powersOfTau28_hez_final_17.ptau before the
  gate runs — fetch-ptau.sh skips its own download whenever a
  checksum-matching file is already present at that path, so no code
  change is needed once the file is available. Alternatively, the
  reducer's own gate environment may have outbound network access this
  worker sandbox lacks; re-running scripts/ceremony/check_owned.py there
  may simply succeed without any further action. If the pinned URL is
  permanently dead, scripts/ceremony/lib.sh's PTAU_URL/PTAU_SHA256 need to
  be re-pinned to a currently-public mirror, verified byte-for-byte
  against a trusted source before changing the hash.
