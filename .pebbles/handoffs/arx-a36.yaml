summary: >
  Ported scripts/ceremony/*.sh from feat/public-ceremony onto this branch
  and scoped lib.sh's DEFAULT_SHAPES to the three owned shapes (1x1_owned,
  1x2_owned, 1x3_owned) — the only shapes onboarded to this ceremony on
  integrated so far, so the same tooling stays one ceremony kind. Added
  scripts/ceremony/check_owned.py as the linked spec's acceptance probe:
  each of its seven modes drives the real init/contribute/verify/export
  flow for the owned shapes, against the real pinned Hermez power-17
  ptau, inside a fresh .scratch/ dry-run directory, never reading or
  writing the real ceremony/ directory (which does not exist on this
  branch). Added --zkey/--vkey override flags to tests/owned-proof.js
  (backward compatible — existing callers pass neither flag and are
  unaffected) so the probe's prove-verify mode can build and check a
  proof against the ceremony's own contributed zkey instead of that
  file's unrelated dev key. Added docs/CEREMONY.md and
  scripts/ceremony/CLAUDE.md.

  Blocked on a confirmed external-resource problem: the pinned ptau
  download fails in this environment (see blocker below), so six of the
  seven acceptance tests cannot complete here. Before concluding this, I
  validated the mechanism itself is correct: with a locally-generated
  power-17 ptau in the exact pinned file's slot (same binary format,
  deliberately different — non-pinned — contents, used only for this
  local check and not committed), I ran init.sh, contribute.sh, and
  snarkjs zkey verify by hand for all three owned shapes (all three report
  "ZKey Ok!"), confirmed the manifest lists exactly the three owned
  shapes, exported a verification key from the contributed (not bare
  setup) zkey, and ran tests/owned-proof.js's new --zkey/--vkey path
  end to end for transact-owned-1x2: groth16.verify reported
  verified: true. This proves scripts/ceremony/check_owned.py's logic is
  correct; only the one external fetch is blocked. The
  no-secrets-committed mode needs no network and passes now:
  {"tracked_dry_run_files": 0, "real_state_modified": false}.
