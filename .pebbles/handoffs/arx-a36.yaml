summary: >
  Phase-2 Groth16 ceremony tooling for the three owned Transact shapes
  (1x1_owned, 1x2_owned, 1x3_owned), in the same ceremony format the plain
  shapes use (no second ceremony kind). Ported scripts/ceremony/*.sh and
  added scripts/ceremony/check_owned.py as the linked spec's acceptance
  probe, docs/CEREMONY.md and scripts/ceremony/CLAUDE.md. Added optional
  --zkey/--vkey flags to tests/owned-proof.js (backward compatible) so the
  probe's prove-verify mode checks a proof against the ceremony's own
  contributed zkey.

  The worker handoff was blocked on an external resource: the pinned Hermez
  power-17 ptau download returned HTTP 403 (the zkevm GCS bucket revoked
  anonymous reads). The husband resolved it (commit 6c4bda7): re-pinned
  PTAU_URL to https://circom.info/powersOfTau28_hez_final_17.ptau, whose
  file is byte-for-byte identical to the unchanged pinned sha256
  6b662a324867139fb1a20a324d90b6ff61856dfb23f59326909f14b0e2483ae0; fixed
  check_owned.py's zkey-verify mode, which matched the literal "OK" while
  snarkjs prints "ZKey Ok!" (it now matches case-insensitively); and made
  fetch-ptau.sh require curl only when it actually downloads, so a
  pre-placed checksum-matching ptau needs no curl in a sealed gate.

  Verified against the real pinned ptau: all seven check_owned.py modes
  pass. ptau-pin ptau_matches_pinned_hash true; no-secrets-committed
  tracked_dry_run_files 0 and real_state_modified false; contributions
  owned_shapes_with_contribution 3; manifest manifest_shape_count 3 and
  manifest_is_exactly_owned true; zkey-verify zkey_ok_count 3;
  verifying-keys verifying_keys_exported 3 and ceremony_kinds 1;
  prove-verify transact-owned-1x2 proof_verified true and
  key_is_contributed true.
cost: ~140k tokens (worker) plus husband fix
